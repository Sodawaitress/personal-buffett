{% extends 'base.html' %}
{% block title %}{{ stock.name }} — 机构雷达 — {{ t.brand }}{% endblock %}

{% block content %}
<div class="stock-page">
{% include 'stock/_head.html' %}

  <div class="stock-page-body">
    <div id="intention-root">
      <div class="intention-loading" id="intention-loading" style="display:flex">
        <div class="intention-spinner"></div>
        <span>正在拉取机构信号，稍等片刻…</span>
        <span style="font-size:11px;color:var(--ink-faint)">（调研热度 + 融券余量 + 机构参与度，约需 15 秒）</span>
      </div>
      <div id="intention-content" style="display:none"></div>
      <div id="intention-empty" style="display:none">
        <p class="intention-error">加载失败，请刷新重试</p>
      </div>
    </div>
  </div>

  {% if in_watchlist %}
  <div class="stock-remove-zone">
    <form method="post" action="{{ url_for('remove_stock', code=stock.code) }}">
      <button type="submit" class="btn-remove-stock"
              onclick="return confirm('{{ t.btn_remove_stock }} {{ stock.name }}?')">{{ t.btn_remove_stock }}</button>
    </form>
  </div>
  {% endif %}

</div>
{% endblock %}

{% block scripts %}
<script>
window._t = {
  full_refresh_msg: {{ t.js_full_refresh_msg | tojson }},
  quant_only_msg:   {{ t.js_quant_only_msg | tojson }},
  buffett_check:    {{ t.js_buffett_check | tojson }},
  refresh_news:     {{ t.js_refresh_news_menu | tojson }},
  full_refresh:     {{ t.js_full_refresh_menu | tojson }},
  full_update_lbl:  {{ t.btn_full_update | tojson }},
  is_admin:         {{ (session.role == 'admin') | tojson }},
  in_watchlist:     {{ in_watchlist | tojson }},
};
window._stockCode = {{ stock.code | tojson }};
</script>
<script src="{{ url_for('static', filename='js/stock-common.js') }}"></script>
<script src="{{ url_for('static', filename='js/stock-radar.js') }}"></script>
<script>
// Auto-load on page open
document.addEventListener('DOMContentLoaded', () => loadIntentionTab());
</script>
{% endblock %}
