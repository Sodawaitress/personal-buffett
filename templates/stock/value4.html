{% extends "base.html" %}
{% block title %}{{ stock_name }} · 现在贵还是便宜{% endblock %}
{% block styles %}
<style>
.vf-wrap { max-width:600px; margin:40px auto; padding:0 20px 80px;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; }
.vf-crumb { font-size:13px; color:#9ca3af; margin-bottom:24px; }
.vf-crumb a { color:#6b7280; text-decoration:none; }
.vf-crumb a:hover { color:#111; }
.vf-steps { display:flex; gap:6px; margin-bottom:32px; }
.vf-step  { height:4px; flex:1; border-radius:2px; background:#e5e7eb; }
.vf-step.done   { background:#16a34a; }
.vf-step.active { background:#111; }
.vf-headline { font-size:24px; font-weight:800; color:#111; margin-bottom:6px; }
.vf-sub { font-size:14px; color:#6b7280; margin-bottom:28px; line-height:1.6; }

/* 推理进度条 */
.reasoning-steps { display:flex; flex-direction:column; gap:8px; margin-bottom:28px; }
.rs-row { display:flex; align-items:center; gap:12px; }
.rs-icon { width:28px; height:28px; border-radius:50%; background:#16a34a;
  color:#fff; font-size:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.rs-icon.partial { background:#f59e0b; }
.rs-icon.empty   { background:#e5e7eb; color:#9ca3af; }
.rs-body { flex:1; }
.rs-label { font-size:13px; font-weight:600; color:#111; }
.rs-val   { font-size:12px; color:#6b7280; }

/* 估值结果大卡片 */
.val-card { border-radius:16px; padding:28px; margin-bottom:24px; text-align:center; }
.val-card.cheap  { background:#f0fdf4; border:2px solid #86efac; }
.val-card.fair   { background:#fefce8; border:2px solid #fde68a; }
.val-card.pricey { background:#fff1f2; border:2px solid #fecaca; }
.val-verdict { font-size:28px; font-weight:800; margin-bottom:8px; }
.val-card.cheap  .val-verdict { color:#15803d; }
.val-card.fair   .val-verdict { color:#92400e; }
.val-card.pricey .val-verdict { color:#b91c1c; }
.val-range { font-size:16px; color:#374151; margin-bottom:6px; }
.val-cur   { font-size:14px; color:#6b7280; }
.val-pct   { font-size:20px; font-weight:700; margin-top:10px; }
.val-card.cheap  .val-pct { color:#16a34a; }
.val-card.pricey .val-pct { color:#ef4444; }

/* 价格尺 */
.price-ruler { position:relative; margin:20px 0; }
.ruler-bar { height:10px; border-radius:5px; margin:8px 0;
  background:linear-gradient(to right,#86efac,#fde68a,#fca5a5); }
.ruler-dot { position:absolute; top:50%; transform:translate(-50%,-50%);
  width:16px; height:16px; border-radius:50%;
  background:#111; border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.25); }
.ruler-labels { display:flex; justify-content:space-between; font-size:11px; color:#9ca3af; }

/* 买入理由 */
.thesis-section { margin-top:4px; }
.thesis-label { font-size:14px; font-weight:600; color:#111; margin-bottom:8px; }
.thesis-input { width:100%; border:1.5px solid #e5e7eb; border-radius:10px;
  padding:14px; font-size:14px; line-height:1.6; resize:vertical;
  min-height:100px; font-family:inherit; color:#111; background:#fff;
  box-sizing:border-box; }
.thesis-input:focus { outline:none; border-color:#111; }
.review-row { display:flex; align-items:center; gap:10px; margin-top:14px; }
.review-label { font-size:13px; color:#6b7280; white-space:nowrap; }
.review-input { border:1.5px solid #e5e7eb; border-radius:8px; padding:8px 12px;
  font-size:13px; color:#111; }

/* 保存按钮 */
.save-btn { width:100%; margin-top:24px; padding:16px;
  background:#111; color:#fff; border:none; border-radius:12px;
  font-size:16px; font-weight:700; cursor:pointer; transition:background .15s; }
.save-btn:hover { background:#333; }
.save-btn:disabled { background:#9ca3af; cursor:not-allowed; }

/* P/S 亏损分支 */
.ps-warn { background:#fffbeb; border:1.5px solid #fde68a; border-radius:12px;
  padding:16px 18px; margin-bottom:16px; }
.ps-warn-title { font-size:15px; font-weight:700; color:#92400e; margin-bottom:4px; }
.ps-warn-body  { font-size:13px; color:#78350f; line-height:1.6; }
.ps-reasoning  { background:#f9fafb; border:1.5px solid #e5e7eb; border-radius:12px;
  padding:16px 18px; margin-bottom:16px; }
.ps-reasoning-title { font-size:11px; font-weight:700; color:#9ca3af;
  text-transform:uppercase; letter-spacing:.5px; margin-bottom:12px; }
.ps-rs-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.ps-rs-row:last-child { margin-bottom:0; }
.ps-rs-label { font-size:13px; color:#6b7280; width:72px; flex-shrink:0; }
.ps-rs-bar-wrap { flex:1; height:6px; background:#e5e7eb; border-radius:3px; overflow:hidden; }
.ps-rs-bar { height:100%; border-radius:3px; background:#16a34a; }
.ps-rs-val { font-size:13px; font-weight:600; color:#111; white-space:nowrap; }
.ps-card { border-radius:14px; padding:20px; margin-bottom:16px; }
.ps-card.cheap  { background:#f0fdf4; border:1.5px solid #86efac; }
.ps-card.fair   { background:#fefce8; border:1.5px solid #fde68a; }
.ps-card.pricey { background:#fef2f2; border:1.5px solid #fecaca; }
.ps-num { font-size:36px; font-weight:800; margin-bottom:2px; }
.ps-num-label { font-size:13px; color:#6b7280; margin-bottom:12px; }
.ps-range-bar-wrap { height:8px; background:#e5e7eb; border-radius:4px;
  margin:8px 0; position:relative; }
.ps-range-bar-fill { height:100%; background:#d1fae5; border-radius:4px; position:absolute; }
.ps-range-dot { width:14px; height:14px; border-radius:50%; background:#111;
  border:2px solid #fff; box-shadow:0 1px 4px rgba(0,0,0,.2);
  position:absolute; top:50%; transform:translate(-50%,-50%); }
.ps-range-labels { display:flex; justify-content:space-between; font-size:11px; color:#9ca3af; }
.ps-verdict { font-size:14px; font-weight:600; margin-top:10px; }
.ps-card.cheap  .ps-verdict { color:#15803d; }
.ps-card.fair   .ps-verdict { color:#92400e; }
.ps-card.pricey .ps-verdict { color:#b91c1c; }
.ps-gm { font-size:13px; color:#374151; margin-top:8px; }
.ps-reference { font-size:12px; color:#9ca3af; margin-top:8px; line-height:1.6; }

.vf-nav { margin-top:12px; display:flex; gap:10px; justify-content:flex-end; }
.vf-btn-back { background:#f3f4f6; color:#374151; border:none;
  border-radius:8px; padding:12px 20px; font-size:14px; font-weight:500; cursor:pointer; }
</style>
{% endblock %}

{% block content %}
<div class="vf-wrap">

  <div class="vf-crumb">
    <a href="{{ url_for('index') }}">首页</a> /
    <a href="{{ url_for('stock_page', code=code) }}">{{ stock_name }}</a> /
    算算它值多少钱
  </div>

  <div class="vf-steps">
    <div class="vf-step done"></div>
    <div class="vf-step done"></div>
    <div class="vf-step done"></div>
    <div class="vf-step active"></div>
  </div>

  <div class="vf-headline">现在贵还是便宜？</div>
  <div class="vf-sub">把你的三步判断加起来，算出一个价格锚点。</div>

  <!-- 推理摘要 -->
  <div class="reasoning-steps" id="reasoning-steps"></div>

  <!-- 估值结果 -->
  <div id="val-result"></div>

  <!-- 价格尺 -->
  <div class="price-ruler" id="price-ruler" style="display:none">
    <div class="ruler-bar"></div>
    <div class="ruler-dot" id="ruler-dot"></div>
    <div class="ruler-labels" id="ruler-labels"></div>
  </div>

  <!-- 买入理由 -->
  <div class="thesis-section" id="thesis-section" style="display:none">
    <div class="thesis-label">我认为值得关注，因为：</div>
    <textarea class="thesis-input" id="thesis-input"
      placeholder="用自己的话写下判断——这能防止你之后因股价波动而改变主意。"></textarea>
    <div class="review-row">
      <span class="review-label">下次复查：</span>
      <input type="date" class="review-input" id="review-date" value="">
    </div>
    <button class="save-btn" id="save-btn" onclick="saveThesis()">保存判断 →</button>
    <div style="font-size:12px;color:#9ca3af;text-align:center;margin-top:8px" id="save-status"></div>
  </div>

  <div class="vf-nav">
    <button class="vf-btn-back" onclick="window.location.href='/stock/{{ code }}/value/3'">← 上一步</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const CODE   = '{{ code }}';
const KEY_P1 = 'vf_p1_' + CODE;
const KEY_P2 = 'vf_p2_' + CODE;
const KEY_P3 = 'vf_p3_' + CODE;

let _p1 = {}, _p2 = {}, _p3 = {};
try { _p1 = JSON.parse(localStorage.getItem(KEY_P1)||'{}'); } catch(e){}
try { _p2 = JSON.parse(localStorage.getItem(KEY_P2)||'{}'); } catch(e){}
try { _p3 = JSON.parse(localStorage.getItem(KEY_P3)||'{}'); } catch(e){}

const CUR_SYMBOL = {cn:'¥',us:'$',hk:'HK$',au:'A$',nz:'NZ$',kr:'₩'}[_p1.market||'us'] || '$';

// ── P/S 分支（EPS≤0 的亏损/成长公司）────────────────────────
async function _renderPsBranch(eps) {
  const el = document.getElementById('val-result');
  el.innerHTML = '<div style="color:#9ca3af;font-size:13px;padding:12px 0">加载 P/S 数据中…</div>';

  let pd = {};
  try {
    const r = await fetch('/api/value/' + CODE + '/earnings');
    pd = await r.json();
  } catch(e) { /* ignore, show with fallback */ }

  const ps      = pd.ps_current;
  const hist    = pd.ps_history;
  const revG    = pd.revenue_growth;
  const gm      = pd.gross_margin;
  const price   = pd.price || _p1.price;
  const cur     = _p1.currency || CUR_SYMBOL.replace('$','USD').replace('¥','CNY');

  // 行业 P/S 参考
  const PS_REF = {
    'SaaS': {lo:5, hi:15}, 'Software': {lo:5, hi:15},
    'Consumer App': {lo:4, hi:12}, 'Technology': {lo:5, hi:20},
    'Gaming': {lo:2, hi:6}, 'E-commerce': {lo:1, hi:4},
    'default': {lo:3, hi:10},
  };
  const sector = (pd.industry_name || '').trim();
  let ref = PS_REF.default;
  for (const [k, v] of Object.entries(PS_REF)) {
    if (sector.toLowerCase().includes(k.toLowerCase())) { ref = v; break; }
  }

  // P/S 评估
  let psVerdict = '', psCls = 'fair', psVerdictText = '';
  if (ps != null) {
    if (hist) {
      const pct = (ps - hist.low) / (hist.high - hist.low);
      if (pct < 0.35)       { psCls = 'cheap';  psVerdict = '历史低位'; psVerdictText = `当前 P/S 处于近期历史低位（低 ${Math.round((1-ps/hist.median)*100)}% vs 历史中位）`; }
      else if (pct > 0.65)  { psCls = 'pricey'; psVerdict = '历史高位'; psVerdictText = `当前 P/S 高于历史中位（+${Math.round((ps/hist.median-1)*100)}%）`; }
      else                  { psCls = 'fair';   psVerdict = '历史中位附近'; psVerdictText = '当前估值处于历史合理区间'; }
    } else if (ps < ref.lo) {
      psCls = 'cheap'; psVerdict = '低于行业参考'; psVerdictText = `${sector||'同类公司'} P/S 参考区间 ${ref.lo}x~${ref.hi}x，当前 ${ps}x 偏低`;
    } else if (ps > ref.hi) {
      psCls = 'pricey'; psVerdict = '高于行业参考'; psVerdictText = `${sector||'同类公司'} P/S 参考区间 ${ref.lo}x~${ref.hi}x，当前 ${ps}x 偏高`;
    } else {
      psCls = 'fair'; psVerdict = '在行业参考范围内'; psVerdictText = `${sector||'同类公司'} P/S 参考区间 ${ref.lo}x~${ref.hi}x`;
    }
  }

  // 营收增速条
  const revGPct = revG != null ? Math.round(revG * 100) : null;
  const revGBar = revGPct != null ? Math.min(100, Math.max(0, (revGPct / 60) * 100)) : 50;
  const demandMap = {expanding:'需求扩张 · App 在加速扩散', stable:'需求平稳', contracting:'需求收缩'};
  const yearsStr  = _p3.years ? `你认为：${_p3.years} 年+` : '未填写';

  // P/S 历史区间条
  let histBarHtml = '';
  if (hist && ps != null) {
    const range = hist.high - hist.low || 1;
    const fillW = Math.round((hist.median - hist.low) / range * 100);
    const dotPct = Math.round(Math.min(1, Math.max(0, (ps - hist.low) / range)) * 100);
    histBarHtml = `
      <div style="margin-top:10px">
        <div class="ps-range-bar-wrap">
          <div class="ps-range-bar-fill" style="left:0;width:${fillW}%"></div>
          <div class="ps-range-dot" style="left:${dotPct}%"></div>
        </div>
        <div class="ps-range-labels">
          <span>低位 ${hist.low}x</span>
          <span>中位 ${hist.median}x</span>
          <span>高位 ${hist.high}x</span>
        </div>
      </div>`;
  }

  // 毛利率说明
  const gmHtml = gm != null
    ? `<div class="ps-gm">毛利率 <strong>${Math.round(gm*100)}%</strong>${gm > 0.6 ? ' — 高毛利，成长期亏损可接受' : ''}</div>`
    : '';

  el.innerHTML = `
    <div class="ps-warn">
      <div class="ps-warn-title">⚠️ 这家公司还在扩张期，每股暂时亏损</div>
      <div class="ps-warn-body">
        EPS × PE 对成长公司没有意义。<br>
        改用「市场为每 1 元营收愿意付多少钱」来参考位置。
      </div>
    </div>

    <div class="ps-reasoning">
      <div class="ps-reasoning-title">你的推理过程</div>
      <div class="ps-rs-row">
        <div class="ps-rs-label">营收增速</div>
        <div class="ps-rs-bar-wrap">
          <div class="ps-rs-bar" style="width:${revGBar}%"></div>
        </div>
        <div class="ps-rs-val">${revGPct != null ? '+' + revGPct + '%/年' : '—'}</div>
      </div>
      <div class="ps-rs-row">
        <div class="ps-rs-label">市场动向</div>
        <div class="ps-rs-bar-wrap">
          <div class="ps-rs-bar" style="width:${_p2.demand==='expanding'?75:_p2.demand==='stable'?50:25}%;
            background:${_p2.demand==='expanding'?'#16a34a':_p2.demand==='contracting'?'#ef4444':'#f59e0b'}"></div>
        </div>
        <div class="ps-rs-val">${demandMap[_p2.demand]||'未填写'}</div>
      </div>
      <div class="ps-rs-row">
        <div class="ps-rs-label">护城河年限</div>
        <div class="ps-rs-bar-wrap">
          <div class="ps-rs-bar" style="width:${Math.min(100,(_p3.years||0)/30*100)}%"></div>
        </div>
        <div class="ps-rs-val">${yearsStr}</div>
      </div>
    </div>

    ${ps != null ? `
    <div class="ps-card ${psCls}">
      <div style="font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">当前市销率（P/S）</div>
      <div class="ps-num">${ps}x</div>
      <div class="ps-num-label">市场为每 ${CUR_SYMBOL}1 营收付 ${ps} 元</div>
      ${histBarHtml}
      <div class="ps-verdict">${psVerdict}${psVerdictText ? ' — ' + psVerdictText : ''}</div>
      ${gmHtml}
      <div class="ps-reference">
        ${sector||'科技'} 行业参考区间：${ref.lo}x ~ ${ref.hi}x（经验值，不是精确目标）
      </div>
    </div>` : `
    <div style="background:#f9fafb;border-radius:12px;padding:16px;color:#9ca3af;font-size:13px;margin-bottom:16px">
      P/S 数据暂时不可用，可直接写下你的判断后保存。
    </div>`}`;

  document.getElementById('thesis-section').style.display = '';
  const d = new Date(); d.setMonth(d.getMonth() + 6);
  document.getElementById('review-date').value = d.toISOString().slice(0,10);
  window._fvLow  = hist ? hist.low  : (ps ? ps * 0.7 : null);
  window._fvHigh = hist ? hist.high : (ps ? ps * 1.3 : null);
  window._price  = price || null;
  window._psMethod = true;
  window._psCurrent = ps;
}

// ── 推理摘要 ────────────────────────────────────────────────
function buildReasoning() {
  const items = [];
  // Step 1
  if (_p1.eps_base != null) {
    const labels = ['','太乐观了','可能高了','差不多','可能低了','太保守了'];
    const adjG = Math.round((_p1.adjusted_growth||0)*100);
    items.push({ ok:true,
      label:'这家公司赚多少？',
      val: `${CUR_SYMBOL}${Number(_p1.eps_base).toFixed(2)}/股 · 增长假设 ${adjG}%/年（你的判断：${labels[_p1.conviction]||'—'}）`
    });
  } else {
    items.push({ ok:false, label:'这家公司赚多少？', val:'未完成 Step 1' });
  }
  // Step 2
  if (_p2.demand) {
    const m = {expanding:'需求扩张 — 市场在增长',stable:'需求平稳 — 维持现有规模',contracting:'需求收缩 — 市场在萎缩'};
    items.push({ ok:true, label:'消费市场在不在买？',
      val: m[_p2.demand] || _p2.demand });
  } else {
    items.push({ ok:'partial', label:'消费市场在不在买？', val:'未完成 Step 2' });
  }
  // Step 3
  if (_p3.years) {
    items.push({ ok:true, label:'还能挣多少年的钱？',
      val:`${_p3.years}年 · 合理 PE ${_p3.pe_low}x ~ ${_p3.pe_high}x` });
  } else {
    items.push({ ok:false, label:'还能挣多少年？', val:'未完成 Step 3' });
  }

  const el = document.getElementById('reasoning-steps');
  el.innerHTML = items.map(it => {
    const cls = it.ok === true ? '' : it.ok === 'partial' ? 'partial' : 'empty';
    const icon = it.ok === true ? '✓' : it.ok === 'partial' ? '~' : '?';
    return `<div class="rs-row">
      <div class="rs-icon ${cls}">${icon}</div>
      <div class="rs-body">
        <div class="rs-label">${it.label}</div>
        <div class="rs-val">${it.val}</div>
      </div>
    </div>`;
  }).join('');
}

// ── 估值计算 ────────────────────────────────────────────────
function buildValuation() {
  const eps     = _p1.eps_base;
  const peLow   = _p3.pe_low;
  const peHigh  = _p3.pe_high;
  const curPrice = _p1.price_at_buy || null;  // 可能没有

  if (!eps || !peLow) {
    document.getElementById('val-result').innerHTML =
      '<div style="color:#9ca3af;font-size:14px;padding:20px 0">请先完成前三步再查看估值。</div>';
    return;
  }

  // ── 亏损公司：改用 P/S 估值分支 ────────────────────────────
  if (eps <= 0) {
    _renderPsBranch(eps);
    return;
  }

  // ── 盈利公司：正常 EPS × PE 估值 ─────────────────────────────
  // 需求趋势调整安全边际：收缩时要求更大折扣
  const demandMult = {expanding:1.0, stable:0.95, contracting:0.85}[_p2.demand] || 1.0;
  const fvLow  = Math.round(eps * peLow  * demandMult);
  const fvHigh = Math.round(eps * peHigh * demandMult);

  // 当前价格：从 Step 1 传来的 pe_current 和 eps 反推
  const pe   = _p1.pe_current;
  const price = pe && eps ? Math.round(pe * eps * 100) / 100 : null;

  let verdict, cardCls, pctText = '';
  if (price) {
    if (price < fvLow) {
      verdict = '价格低于公允价值';
      cardCls = 'cheap';
      pctText = `低估约 ${Math.round((fvLow - price) / fvLow * 100)}% ~ ${Math.round((fvHigh - price) / fvHigh * 100)}%`;
    } else if (price > fvHigh) {
      verdict = '价格高于公允价值';
      cardCls = 'pricey';
      pctText = `高估约 ${Math.round((price - fvHigh) / fvHigh * 100)}%`;
    } else {
      verdict = '价格在合理区间内';
      cardCls = 'fair';
      pctText = '处于公允区间';
    }
  } else {
    verdict = '公允价值估算';
    cardCls = 'fair';
  }

  const priceStr = price ? `当前价格约 ${CUR_SYMBOL}${price.toFixed(2)}` : '当前价格数据不足';
  document.getElementById('val-result').innerHTML = `
    <div class="val-card ${cardCls}">
      <div class="val-verdict">${verdict}</div>
      <div class="val-range">公允价值区间：${CUR_SYMBOL}${fvLow} ~ ${CUR_SYMBOL}${fvHigh}</div>
      <div class="val-cur">${priceStr}</div>
      ${pctText ? `<div class="val-pct">${pctText}</div>` : ''}
    </div>`;

  // 价格尺
  if (price) {
    const lo = Math.min(price, fvLow)  * 0.85;
    const hi = Math.max(price, fvHigh) * 1.15;
    const pct = v => Math.round((v - lo) / (hi - lo) * 100);
    const ruler = document.getElementById('price-ruler');
    ruler.style.display = 'block';
    // dot position = current price
    document.getElementById('ruler-dot').style.left = pct(price) + '%';
    document.getElementById('ruler-labels').innerHTML =
      `<span>${CUR_SYMBOL}${Math.round(lo)}</span>` +
      `<span>公允区间 ${CUR_SYMBOL}${fvLow}~${CUR_SYMBOL}${fvHigh}</span>` +
      `<span>${CUR_SYMBOL}${Math.round(hi)}</span>`;
  }

  // 买入理由框
  document.getElementById('thesis-section').style.display = '';
  // 默认复查日期：6个月后
  const d = new Date(); d.setMonth(d.getMonth() + 6);
  document.getElementById('review-date').value = d.toISOString().slice(0,10);

  // 存 fair value 供保存用
  window._fvLow  = fvLow;
  window._fvHigh = fvHigh;
  window._price  = price;
}

// ── 保存 ────────────────────────────────────────────────────
function saveThesis() {
  const thesis = document.getElementById('thesis-input').value.trim();
  const review = document.getElementById('review-date').value;
  const btn    = document.getElementById('save-btn');
  btn.disabled = true;
  btn.textContent = '保存中…';

  fetch('/api/value/' + CODE + '/save', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      earnings_ps:       _p1.eps_base,
      demand_trend:      _p2.demand,
      years_choice:      _p3.years,
      pe_low:            _p3.pe_low,
      pe_high:           _p3.pe_high,
      fair_value_low:    window._fvLow,
      fair_value_high:   window._fvHigh,
      price_at_save:     window._price,
      buy_thesis:        thesis,
      review_date:       review,
      valuation_method:  window._psMethod ? 'ps' : 'eps_pe',
      ps_current:        window._psCurrent || null,
    })
  })
  .then(r => r.json())
  .then(d => {
    if (d.ok) {
      btn.textContent = '✓ 已保存';
      btn.style.background = '#16a34a';
      document.getElementById('save-status').textContent = '判断已记录。你可以在持仓页看到它。';
      // 清除 localStorage
      [KEY_P1,KEY_P2,KEY_P3].forEach(k => localStorage.removeItem(k));
    }
  })
  .catch(() => {
    btn.disabled = false;
    btn.textContent = '保存失败，请重试';
  });
}

buildReasoning();
buildValuation();
</script>
{% endblock %}
