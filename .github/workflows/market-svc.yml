name: market-svc (US-138)

# 市场信息流服务：宏观快照 + 国际新闻/摩根大通 + 重大新闻扫描(US-118)。
# 接手旧 monolith 里没人认领的被动信息流；数据源是 Google News RSS + 宏观接口，
# 与个股抓取无依赖 —— 挂了不影响价格/分析/推送。

# ── US-150 事件驱动链（2026-08-19）─────────────────────────────
# 全链只有 fetch-svc 一个 cron 锚点（A股 15:00 CST 收盘后），其余靠
# workflow_run 首尾相接。这么做的理由，按重要性排：
#
#  ① 原来每个服务各自排 cron，链条横跨 07:32→15:06 UTC 共 7.5 小时，
#     其中约 1.5 小时是纯空转（等下一个 cron）。串行总耗时其实只有 244 分钟。
#     结果 snapshot 在 CST 23:06 才生成，而 Claude Routine 21:30 就去读了 ——
#     妈妈的信永远基于前一天收盘，周一更是读到周五的（72h，US-149 的 26h
#     宽通道也兜不住）。
#  ② GHA cron 延迟不稳定：2026-08-15 实测 +40~76 分钟，08-18 实测 +19~43 分钟。
#     靠固定 cron 去"猜"上游跑完没有，本质上不可靠。
#  ③ 同一时刻只有一条链在跑，东财消费者（radar → market → scan）天然串行，
#     比 US-139 用时间猜串行更严格。
#
# 链序：fetch → analyze → push → radar → market → Daily Cron(扫描+等待) → digest
# digest 挂在最后：Daily Cron 会阻塞到 Fly 扫描真跑完，这样快照里的
# precursor 数据才是完整的（US-150 上半场已修，见 cron.yml）。
#
# 失败传播：只挡 cancelled，failure 仍放行下游 —— 各服务本就设计成互相独立
# （analyze 挂了也该把已有报告推出去），一环挂掉不该让全天归零。
# 历史：US-150 时本服务由 radar-svc 末尾的 `gh workflow run` 桥接触发，
# 因为 workflow_run 最多串三层而 market 在链上是第 4 层。US-170 起统一由
# pipeline.yml 用 workflow_call 调用，那两道闸都不再适用。
# 08-21 实测 market/DailyCron/digest 三个全没触发。详见 radar-svc.yml 里
# US-170：改为**可重用工作流**（workflow_call），由 pipeline.yml 顺序编排。
# 不再用 workflow_run —— 那是「事件通知」原语，带两道防递归闸（最多三层、
# GITHUB_TOKEN 触发的运行不发事件），这两道闸的存在意义恰恰就是阻止
# 用 workflow 链成流水线。US-150 撞上第一道，US-169 撞上第二道。
# workflow_call 是「函数调用」原语：10 层上限、无 token 规则，
# 整条链是一次 run（实测 github.run_id 与调用方相同）。
# 保留 workflow_dispatch，单独手动补跑照旧。
on:
  workflow_call:
    inputs:
      material_days:
        required: false
        type: string
        default: '3'
  workflow_dispatch:
    inputs:
      material_days:
        description: '重大新闻回溯天数'
        required: false
        default: '3'

jobs:
  market:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write        # US-169：桥接下游需要
    # US-170：失败传播语义搬到 pipeline.yml 的 `if: ${{ !cancelled() }}`——
    # workflow_call 下 github.event_name 读到的是**调用方**的事件（实测），
    # 原来那个 if 恒真，留着只会误导。
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONUNBUFFERED: "1"
      MATERIAL_SCAN_DAYS: ${{ github.event.inputs.material_days || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run market-svc
        run: python -m scripts.svc_market

      - name: Alert on failure
        if: failure()
        run: |
          KEY="${{ secrets.SERVERCHAN_ADMIN_KEY || secrets.SERVERCHAN_KEY }}"
          if [ -n "$KEY" ]; then
            curl -s -X POST "https://sctapi.ftqq.com/${KEY}.send" \
              --data-urlencode "title=⚠️ market-svc 失败" \
              --data-urlencode "desp=市场信息流服务跑挂了。查看：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              >/dev/null && echo "已推送失败告警"
          else
            echo "无可用 Server酱 key，跳过微信告警"
          fi

