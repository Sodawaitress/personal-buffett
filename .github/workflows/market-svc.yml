name: market-svc (US-138)

# 市场信息流服务：宏观快照 + 国际新闻/摩根大通 + 重大新闻扫描(US-118)。
# 接手旧 monolith 里没人认领的被动信息流；数据源是 Google News RSS + 宏观接口，
# 与个股抓取无依赖 —— 挂了不影响价格/分析/推送。

# ── US-150 事件驱动链（2026-08-19）─────────────────────────────
# 全链只有 fetch-svc 一个 cron 锚点（A股 15:00 CST 收盘后），其余靠
# workflow_run 首尾相接。这么做的理由，按重要性排：
#
#  ① 原来每个服务各自排 cron，链条横跨 07:32→15:06 UTC 共 7.5 小时，
#     其中约 1.5 小时是纯空转（等下一个 cron）。串行总耗时其实只有 244 分钟。
#     结果 snapshot 在 CST 23:06 才生成，而 Claude Routine 21:30 就去读了 ——
#     妈妈的信永远基于前一天收盘，周一更是读到周五的（72h，US-149 的 26h
#     宽通道也兜不住）。
#  ② GHA cron 延迟不稳定：2026-08-15 实测 +40~76 分钟，08-18 实测 +19~43 分钟。
#     靠固定 cron 去"猜"上游跑完没有，本质上不可靠。
#  ③ 同一时刻只有一条链在跑，东财消费者（radar → market → scan）天然串行，
#     比 US-139 用时间猜串行更严格。
#
# 链序：fetch → analyze → push → radar → market → Daily Cron(扫描+等待) → digest
# digest 挂在最后：Daily Cron 会阻塞到 Fly 扫描真跑完，这样快照里的
# precursor 数据才是完整的（US-150 上半场已修，见 cron.yml）。
#
# 失败传播：只挡 cancelled，failure 仍放行下游 —— 各服务本就设计成互相独立
# （analyze 挂了也该把已有报告推出去），一环挂掉不该让全天归零。
# ⚠️ 本服务由 radar-svc 末尾的 `gh workflow run` **桥接**触发，不是 workflow_run。
# 原因：GitHub 硬限制 workflow_run 最多串三层，而 market 在链上是第 4 层。
# 08-21 实测 market/DailyCron/digest 三个全没触发。详见 radar-svc.yml 里
# 「Bridge to market-svc」那一步的注释。改回 workflow_run 会再次静默断链。
on:
  workflow_dispatch:
    inputs:
      material_days:
        description: '重大新闻回溯天数'
        required: false
        default: '3'

jobs:
  market:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write        # US-169：桥接下游需要
    # US-150：链式触发时只挡掉「被取消」的上游。上游 failure 仍放行 ——
    # 各服务本就设计成互相独立（analyze 挂了也该把已有报告推出去），
    # 一环挂掉不该让全天归零。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PYTHONUNBUFFERED: "1"
      MATERIAL_SCAN_DAYS: ${{ github.event.inputs.material_days || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run market-svc
        run: python -m scripts.svc_market

      - name: Alert on failure
        if: failure()
        run: |
          KEY="${{ secrets.SERVERCHAN_ADMIN_KEY || secrets.SERVERCHAN_KEY }}"
          if [ -n "$KEY" ]; then
            curl -s -X POST "https://sctapi.ftqq.com/${KEY}.send" \
              --data-urlencode "title=⚠️ market-svc 失败" \
              --data-urlencode "desp=市场信息流服务跑挂了。查看：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              >/dev/null && echo "已推送失败告警"
          else
            echo "无可用 Server酱 key，跳过微信告警"
          fi

      # US-169：GITHUB_TOKEN 触发的事件**不会再创建新的 workflow run**
      # （GitHub 明文规则，防递归）。US-150 的 radar→market 桥接用的正是
      # GITHUB_TOKEN，所以 market 跑完不发 workflow_run 事件，cron.yml 永远
      # 等不到 —— 桥接修好了第 4 层，却在下一层制造了一模一样的静默断链。
      # 实测：08-24 radar ✅ → market ✅(dispatch) → cron ❌ 从未触发；
      # 而 08-22 人手动 dispatch cron 之后 digest 立刻正常 workflow_run。
      # 所以 SEG2 内部一律改成显式 dispatch，不再依赖 workflow_run。
      - name: Bridge to cron.yml (GITHUB_TOKEN 触发不会发 workflow_run 事件)
        if: always()
        run: |
          gh workflow run cron.yml --repo "${{ github.repository }}"
          echo "已 dispatch cron.yml（显式桥接）"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
