name: push-svc (US-121)

# 推送服务：读 DB 最新报告 → Bear/Discord/Server酱 + 各用户个人日报（无重大变化不打扰）。
# 独立于 analyze-svc：analyze 挂了也能把已有最新报告推出去。
# ── US-150 事件驱动链（2026-08-19）─────────────────────────────
# 全链只有 fetch-svc 一个 cron 锚点（A股 15:00 CST 收盘后），其余靠
# workflow_run 首尾相接。这么做的理由，按重要性排：
#
#  ① 原来每个服务各自排 cron，链条横跨 07:32→15:06 UTC 共 7.5 小时，
#     其中约 1.5 小时是纯空转（等下一个 cron）。串行总耗时其实只有 244 分钟。
#     结果 snapshot 在 CST 23:06 才生成，而 Claude Routine 21:30 就去读了 ——
#     妈妈的信永远基于前一天收盘，周一更是读到周五的（72h，US-149 的 26h
#     宽通道也兜不住）。
#  ② GHA cron 延迟不稳定：2026-08-15 实测 +40~76 分钟，08-18 实测 +19~43 分钟。
#     靠固定 cron 去"猜"上游跑完没有，本质上不可靠。
#  ③ 同一时刻只有一条链在跑，东财消费者（radar → market → scan）天然串行，
#     比 US-139 用时间猜串行更严格。
#
# 链序：fetch → analyze → push → radar → market → Daily Cron(扫描+等待) → digest
# digest 挂在最后：Daily Cron 会阻塞到 Fly 扫描真跑完，这样快照里的
# precursor 数据才是完整的（US-150 上半场已修，见 cron.yml）。
#
# 失败传播：只挡 cancelled，failure 仍放行下游 —— 各服务本就设计成互相独立
# （analyze 挂了也该把已有报告推出去），一环挂掉不该让全天归零。
on:
  workflow_run:
    workflows: ["analyze-svc (US-121)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      skip_push:
        description: '1=只生成不真推送（验证用，不打扰妈妈）'
        required: false
        default: '1'

jobs:
  push:
    runs-on: ubuntu-latest
    # US-150：链式触发时只挡掉「被取消」的上游。上游 failure 仍放行 ——
    # 各服务本就设计成互相独立（analyze 挂了也该把已有报告推出去），
    # 一环挂掉不该让全天归零。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
      PYTHONUNBUFFERED: "1"
      # 定时触发 inputs 为空 → 真推送；手动触发默认 skip_push=1 干跑。
      # 不能写 `inputs.skip_push || '1'`：那样定时那一路会永远落到 '1'，排了班也不推。
      SKIP_PUSH: ${{ github.event.inputs.skip_push == '1' && '1' || '' }}
      # US-162：日报候选股票要覆盖的账号（除 admin 之外）。
      # 2 = QQ 账号（妈妈的实际自选股 198 只）。admin(id=4) 只有 33 只，
      # 不加这个的话她那 198 只从来不会进「今天有变化的」推送。
      # 用 env 而不是硬编码：以后加人改这一行就够。
      DIGEST_USER_IDS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run push-svc
        run: python -m scripts.svc_push

      - name: Alert on failure
        if: failure()
        run: |
          KEY="${{ secrets.SERVERCHAN_ADMIN_KEY || secrets.SERVERCHAN_KEY }}"
          if [ -n "$KEY" ]; then
            curl -s -X POST "https://sctapi.ftqq.com/${KEY}.send" \
              --data-urlencode "title=⚠️ push-svc 失败" \
              --data-urlencode "desp=推送服务跑挂了。查看：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              >/dev/null && echo "已推送失败告警"
          fi
