name: 微信推送

on:
  push:
    branches: [main]
    paths:
      - 'output/daily_push.txt'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 读取推送内容并发送 Server酱
        env:
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        run: |
          CONTENT=$(cat output/daily_push.txt)
          TITLE=$(head -1 output/daily_push.txt)
          curl -s -X POST "https://sctapi.ftqq.com/${SERVERCHAN_KEY}.send" \
            -d "title=${TITLE}" \
            --data-urlencode "desp=${CONTENT}" \
            -w "\nHTTP %{http_code}\n"
