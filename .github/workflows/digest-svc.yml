name: digest-svc (US-121)

# 快照服务：从 Neon 汇总自选股 → 构建快照 JSON commit 到 GitHub + 回填预测收益。
# 纯 DB 驱动、无 LLM。独立于 analyze-svc：读 DB 最新价即可提交快照。
# US-150：链条最后一棒，挂在 Daily Cron 之后 —— 它会阻塞到 Fly 扫描真跑完，
# 这样快照里的 precursor 才是完整的（原来 digest 抢跑，机构层数据长期是残的）。
#
# ⚠️ 不再保留 schedule 兜底：实测它不是兜底，是**无条件双跑**
#（08-18 workflow_run 14:43 + schedule 14:53 各跑一次，08-17 那次 schedule
# 还失败了报了假警）。真正的兜底是下面 job 里的 watchdog 判断。
on:
  workflow_run:
    workflows: ["Daily Cron"]
    types: [completed]
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # workflow_run 对 Daily Cron 的任何一次运行都会触发。只挡掉被取消的；
    # 扫描失败也放行——用旧 precursor 缓存出快照，好过没有快照
    # （没快照 = 妈妈收到「今日无分析」）。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'
    # 快照要 commit 回本仓（snapshots/daily_snapshot.json）。GHA 默认 token 只读 →
    # 403 "Resource not accessible by integration"（US-140：US-138 把 digest 从
    # Fly 挪到 GHA 时丢了 Fly secret 里那个有写权限的 PAT，快照因此冻结）。
    permissions:
      contents: write
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ secrets.SNAPSHOT_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run digest-svc
        run: python -m scripts.svc_digest

      - name: Alert on failure
        if: failure()
        run: |
          KEY="${{ secrets.SERVERCHAN_ADMIN_KEY || secrets.SERVERCHAN_KEY }}"
          if [ -n "$KEY" ]; then
            curl -s -X POST "https://sctapi.ftqq.com/${KEY}.send" \
              --data-urlencode "title=⚠️ digest-svc 失败" \
              --data-urlencode "desp=快照/回填服务跑挂了。查看：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              >/dev/null && echo "已推送失败告警"
          fi
