name: _probe-caller (临时，用完删)
on:
  workflow_dispatch:

jobs:
  before:
    runs-on: ubuntu-latest
    steps:
      - run: echo "PROBE caller run_id = ${{ github.run_id }}"

  call:
    needs: before
    uses: ./.github/workflows/_probe-callee.yml
    secrets: inherit
    with:
      note: 'called-by-orchestrator'

  after:
    needs: call
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: echo "PROBE after ran, call result = ${{ needs.call.result }}"
