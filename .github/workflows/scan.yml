name: 每日前兆扫描

on:
  schedule:
    # 08:30 UTC = 16:30 北京时间，周一至周五（A股交易日）
    - cron: '30 8 * * 1-5'
  workflow_dispatch:  # 允许手动触发

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 Fly.io 前兆扫描
        env:
          SCAN_TOKEN: ${{ secrets.SCAN_TOKEN }}
          FLY_APP_URL: https://personal-buffett.fly.dev
        run: |
          RESPONSE=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST "${FLY_APP_URL}/api/trigger-scan" \
            -H "Authorization: Bearer ${SCAN_TOKEN}" \
            -H "Content-Type: application/json")
          echo "HTTP $RESPONSE"
          cat /tmp/resp.json
          if [ "$RESPONSE" != "202" ]; then
            echo "触发失败，退出码 1"
            exit 1
          fi
