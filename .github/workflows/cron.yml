name: Daily Cron

# US-138：monolith 已退役。pipeline job 不再排班，仅保留手动触发作全量回滚入口
# （日常活已拆给 fetch/analyze/radar/market/digest/push-svc）。
# light job 的 precursor scan 仍需每日跑：东财只能在 Fly 悉尼跑，GHA 美国 runner 连不上。
# ⚠️ US-158 修订（2026-08-16）：「地理」这个说法不准确。
# 两地实测（scripts/probe_datasource_reach.py，GHA 美国 + 新西兰本地）结果一致：
# 东财 push2 两地都通、push2his（历史K线）两地都被拒 —— 是东财在拒绝这类
# 客户端特征，不是地理封锁。Fly 悉尼能跑通的具体是哪些 datacenter 端点尚未
# 逐个复测，所以下面的安排先保持不动，但别再把「地理」当成既定原因去推理。

# US-150：改为事件驱动，挂在 market-svc 之后（链序见 analyze-svc.yml 顶部注释）。
# 本 workflow 的 light job 会阻塞到 Fly 上的 precursor 扫描真跑完（约 75 分钟），
# 所以它天然是"东财消费者"的最后一棒，digest 挂在它后面才拿得到完整的
# precursor 数据。
on:
  workflow_run:
    workflows: ["market-svc (US-138)"]
    types: [completed]
  workflow_dispatch:

jobs:
  # 重活：pipeline 直接在 runner 里跑（7GB 内存，不会 OOM），写 Neon
  # 迁 Neon 后 DB 在云上，pipeline 不必挤在 Fly 512MB 上
  pipeline:
    # 只在手动触发时跑：定时那一路已全部拆给各 svc（US-138）
    # 全量回滚入口，仍然只手动触发（链式触发时不跑重活）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run daily pipeline (all users' watchlist → Neon + push)
        run: python -m scripts.stock_pipeline

      - name: Backfill prediction returns
        if: always()
        continue-on-error: true
        run: python -c "from scripts.backfill_returns import backfill_predictions; backfill_predictions()"

      # 绝不静默失败：pipeline 挂了立刻微信推管理员（GitHub 也会默认邮件仓库主）
      - name: Alert on failure
        if: failure()
        run: |
          KEY="${{ secrets.SERVERCHAN_ADMIN_KEY || secrets.SERVERCHAN_KEY }}"
          if [ -n "$KEY" ]; then
            curl -s -X POST "https://sctapi.ftqq.com/${KEY}.send" \
              --data-urlencode "title=⚠️ 每日 pipeline 失败" \
              --data-urlencode "desp=GHA runner 里的每日 pipeline 跑挂了，数据可能过期。查看：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              >/dev/null && echo "已推送失败告警"
          else
            echo "无可用 Server酱 key，跳过微信告警（GitHub 会默认邮件仓库主）"
          fi

  # precursor scan 触发 Fly（悉尼，能连东财；GHA 美国 runner 不行）
  # digest 已交给 digest-svc（US-138），此处不再触发，避免双跑
  light:
    runs-on: ubuntu-latest
    # US-150：链式触发时只挡掉「被取消」的上游。上游 failure 仍放行 ——
    # 各服务本就设计成互相独立（analyze 挂了也该把已有报告推出去），
    # 一环挂掉不该让全天归零。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'
    # US-150：本 job 现在一直等到 Fly 上的扫描真跑完才结束，
    # 好让 digest-svc 挂在它后面，而不是靠 cron 猜时间。
    timeout-minutes: 100
    env:
      APP_URL: ${{ secrets.FLY_APP_URL || 'https://personal-buffett.fly.dev' }}
    steps:
      - name: Trigger precursor scan
        id: trigger
        run: |
          HTTP=$(curl -s -o /tmp/scan.json -w "%{http_code}" \
            -X POST "${APP_URL}/api/trigger-scan" \
            -H "Authorization: Bearer ${{ secrets.SCAN_TOKEN }}")
          echo "scan → HTTP $HTTP"; cat /tmp/scan.json
          [ "$HTTP" = "202" ] || [ "$HTTP" = "200" ]
          JOB_ID=$(python3 -c "import json;print(json.load(open('/tmp/scan.json')).get('job_id') or '')")
          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "扫描 job_id = $JOB_ID"

      # trigger-scan 立刻返回 202，真正的扫描在 Fly 后台跑 75+ 分钟。
      # 实测证据（08-14 快照）：precursor 的 cache_age_hours 从 1.3h 连续分布到 0.0h
      # —— 说明 digest 取快照时扫描还在写，妈妈那封信的机构层读到的是扫了一半的数据。
      - name: Wait for scan to finish
        if: steps.trigger.outputs.job_id != ''
        run: |
          JOB_ID="${{ steps.trigger.outputs.job_id }}"
          DEADLINE=$(( $(date +%s) + 90*60 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            sleep 60
            BODY=$(curl -s "${APP_URL}/api/scan-status/${JOB_ID}" \
              -H "Authorization: Bearer ${{ secrets.SCAN_TOKEN }}")
            STATUS=$(python3 -c "import json,sys;print(json.loads(sys.argv[1]).get('status',''))" "$BODY" 2>/dev/null || echo "")
            echo "[$(date -u +%H:%M:%SZ)] scan status = ${STATUS:-<unreachable>}"
            case "$STATUS" in
              done)   echo "✅ 扫描完成，下游可以安全取快照"; exit 0 ;;
              failed) echo "⚠️ 扫描报错，仍放行下游（旧 precursor 缓存好过没有）"; exit 0 ;;
            esac
          done
          echo "⚠️ 等满 90 分钟仍未结束，放行下游（行为与改动前一致，不更差）"

      # 拿不到 job_id（镜像还没部署 /api/scan-status）时的退路：按实测时长盲等
      - name: Fallback blind wait
        if: steps.trigger.outputs.job_id == ''
        run: |
          echo "未拿到 job_id，退回盲等 80 分钟（实测扫描 ~75 分钟）"
          sleep $(( 80*60 ))
