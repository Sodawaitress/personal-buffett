name: radar-svc (US-121)

# 机构雷达服务：龙虎榜/北向/解禁/大宗/增减持/前兆信号（调研·融券·参与度）。A股专属，AKShare 密集。
# 从 Neon 读价格/资金,前兆信号写回 DB(详情页读)。独立服务：AKShare 慢/挂只影响雷达。
# ── US-150 事件驱动链（2026-08-19）─────────────────────────────
# 全链只有 fetch-svc 一个 cron 锚点（A股 15:00 CST 收盘后），其余靠
# workflow_run 首尾相接。这么做的理由，按重要性排：
#
#  ① 原来每个服务各自排 cron，链条横跨 07:32→15:06 UTC 共 7.5 小时，
#     其中约 1.5 小时是纯空转（等下一个 cron）。串行总耗时其实只有 244 分钟。
#     结果 snapshot 在 CST 23:06 才生成，而 Claude Routine 21:30 就去读了 ——
#     妈妈的信永远基于前一天收盘，周一更是读到周五的（72h，US-149 的 26h
#     宽通道也兜不住）。
#  ② GHA cron 延迟不稳定：2026-08-15 实测 +40~76 分钟，08-18 实测 +19~43 分钟。
#     靠固定 cron 去"猜"上游跑完没有，本质上不可靠。
#  ③ 同一时刻只有一条链在跑，东财消费者（radar → market → scan）天然串行，
#     比 US-139 用时间猜串行更严格。
#
# 链序：fetch → analyze → push → radar → market → Daily Cron(扫描+等待) → digest
# digest 挂在最后：Daily Cron 会阻塞到 Fly 扫描真跑完，这样快照里的
# precursor 数据才是完整的（US-150 上半场已修，见 cron.yml）。
#
# 失败传播：只挡 cancelled，failure 仍放行下游 —— 各服务本就设计成互相独立
# （analyze 挂了也该把已有报告推出去），一环挂掉不该让全天归零。
on:
  workflow_run:
    workflows: ["push-svc (US-121)"]
    types: [completed]
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    # US-150：链式触发时只挡掉「被取消」的上游。上游 failure 仍放行 ——
    # 各服务本就设计成互相独立（analyze 挂了也该把已有报告推出去），
    # 一环挂掉不该让全天归零。
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion != 'cancelled'
    timeout-minutes: 90
    permissions:
      contents: read
      actions: write        # US-150 桥接：需要 dispatch market-svc
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run radar-svc
        run: python -m scripts.svc_radar

      - name: Alert on failure
        if: failure()
        run: |
          KEY="${{ secrets.SERVERCHAN_ADMIN_KEY || secrets.SERVERCHAN_KEY }}"
          if [ -n "$KEY" ]; then
            curl -s -X POST "https://sctapi.ftqq.com/${KEY}.send" \
              --data-urlencode "title=⚠️ radar-svc 失败" \
              --data-urlencode "desp=机构雷达服务跑挂了。查看：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              >/dev/null && echo "已推送失败告警"
          fi

      # ── US-150 链段桥接（2026-08-22 实测踩坑后补）────────────────────
      # GitHub 硬限制：workflow_run 最多串三层。
      #   "You can't use workflow_run to chain together more than three levels
      #    of workflows ... workflows E and F will not be run."
      # 我们的链 fetch → analyze(1) → push(2) → radar(3) → market(4) 正好超限，
      # 08-21 实测 market/DailyCron/digest 三个全没触发（靠 watchdog 补跑才没断供）。
      #
      # 所以在第 3 层末尾**显式改用 dispatch 跨段** —— workflow_dispatch 会重置
      # 嵌套计数，于是 market(dispatch) → DailyCron(1) → digest(2) 又在限内。
      # 这个手法 watchdog 已在生产验证过（它就是用 gh workflow run 补跑 digest 的）。
      #
      # if: always() —— radar 挂了也要放行下游，与本链其余部分的失败传播策略一致。
      - name: Bridge to market-svc (resets workflow_run nesting depth)
        if: always()
        run: |
          gh workflow run market-svc.yml --repo "${{ github.repository }}"
          echo "已 dispatch market-svc（跨段桥接，绕开三层嵌套上限）"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
