name: fetch-svc (US-121)

# 数据抓取服务：只抓行情/新闻/财务/资金/技术面 → Neon，不跑 LLM。
# 独立于 analyze-svc：本服务保证价格永远新鲜，挂了也不拖累分析/推送。
# US-121 第3步（2026-07-12）：并行双跑观察——加 schedule 但旧 monolith(cron.yml 08:00 UTC)
# 仍当家、照常推妈妈。本服务只写 DB 不推送，先自证稳定一周再考虑切换。

# US-170：改为**可重用工作流**（workflow_call），由 pipeline.yml 顺序编排。
# 不再用 workflow_run —— 那是「事件通知」原语，带两道防递归闸（最多三层、
# GITHUB_TOKEN 触发的运行不发事件），这两道闸的存在意义恰恰就是阻止
# 用 workflow 链成流水线。US-150 撞上第一道，US-169 撞上第二道。
# workflow_call 是「函数调用」原语：10 层上限、无 token 规则，
# 整条链是一次 run（实测 github.run_id 与调用方相同）。
# 保留 workflow_dispatch，单独手动补跑照旧。
on:
  workflow_call:
    inputs:
      budget_min:
        required: false
        type: string
        default: '40'
  workflow_dispatch:
    inputs:
      budget_min:
        description: '时间预算（分钟），超了提前停下次续'
        required: false
        default: '40'

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PYTHONUNBUFFERED: "1"
      FETCH_BUDGET_MIN: ${{ github.event.inputs.budget_min || '40' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run fetch-svc
        run: python -m scripts.svc_fetch

      - name: Alert on failure
        if: failure()
        run: |
          KEY="${{ secrets.SERVERCHAN_ADMIN_KEY || secrets.SERVERCHAN_KEY }}"
          if [ -n "$KEY" ]; then
            curl -s -X POST "https://sctapi.ftqq.com/${KEY}.send" \
              --data-urlencode "title=⚠️ fetch-svc 失败" \
              --data-urlencode "desp=数据抓取服务跑挂了，价格可能过期。查看：https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              >/dev/null && echo "已推送失败告警"
          fi
