name: 机构出货模式识别
slug: institution_manipulation_patterns
one_liner: 机构利用消息面向散户出货的三种经典模式，及其识别信号

# 来源：2026-05-14 特朗普访华概念股实战复盘
# 案例：14只受益链A股，11/12只同日融券增加，当天全线下跌
# 核心结论：机构把利好消息当作出货窗口，不是买入窗口

patterns:

  - id: news_exit
    label: 模式一：消息出货
    description: |
      机构提前建仓 → 等待/配合大消息（政策/外交/业绩）→
      散户追消息买进 → 机构卖给散户 → 股价见顶回落

    recognition:
      hard_signals:
        - 消息发布后融券余额快速增加（机构借股做空）
        - 机构持仓净减持（主动基金在撤）
        - 价格当天冲高但收盘涨幅收窄或翻绿
      soft_signals:
        - 成交量比平时放大2倍以上（散户涌入）
        - 新闻情绪极正面，但主力资金净流出
        - 分析师集中发布看多报告（配合出货叙事）

    quantify:
      short_change_threshold: "+10%"   # 融券余额单日或3日涨幅超此值为警告
      price_action: "冲高回落，阳线上影线长"

    case_2026_05_14:
      event: 特朗普访华，带17位CEO
      stocks_affected: [600111, 000831, 600893, 601111, 300433, 300676]
      short_change_range: "+1.4% ~ +19.8%"
      result: "消息发布当日12只概念股11只融券增加，全线收跌"

  - id: etf_cover
    label: 模式二：ETF掩护出货
    description: |
      被动ETF因指数权重调整被动买入（时间透明可预测）→
      主动机构趁ETF买盘制造的承接力，同步卖出自己筹码 →
      表面数据显示"机构增持"，实际是主动资金在离场 →
      散户看到"增持"数据买进，接了主动资金的盘

    recognition:
      hard_signals:
        - 增持方名单全是"XXX ETF联接""XXX指数型""XXX ETF"
        - 无主动偏股型基金、QFII、社保在增持
        - 同期融券余额上升
      soft_signals:
        - 个股刚被纳入某指数或权重调升（触发被动配置）
        - 主力资金净流出（真实资金方向）

    quantify:
      etf_ratio_threshold: ">80%"   # 增持方中被动ETF占比超此值视为"ETF掩护"
      note: "需区分增持机构类型，不能只看增持家数"

    case_2026_05_14:
      stocks: [600111, 000831, 600392]
      pattern: "增持方全是南方有色金属ETF联接、嘉实中证稀土ETF（被动配置）"
      note: "稀土板块表面增持最多，实为被动权重调整，主动资金未进场"

  - id: survey_short_paradox
    label: 模式三：调研-做空矛盾
    description: |
      大量机构去公司调研（制造"机构认真研究"的公开印象）→
      调研信息通过研报/媒体传到散户："N家机构调研！" →
      散户买入 →
      实际：部分调研机构调研目的是找卖出依据，
      调研后同步建立融券空仓

    recognition:
      hard_signals:
        - 调研家数高（>30家）且调研后30天内融券余额增加
        - 调研后股价不涨反跌（信息已被定价或机构在压价）
      soft_signals:
        - 调研为业绩说明会（全员开放型），非专项定向调研
        - 调研后无主动基金建仓记录

    quantify:
      divergence_signal: "调研家数 > 30 且 调研后融券变化 > +5% → 矛盾信号，警告"

    case_2026_05_14:
      stock: "300433 蓝思科技"
      survey: "118家机构调研 · 2026-04-15"
      short_change: "+19.3%"
      conclusion: "调研热度最高，做空幅度也最高，典型矛盾模式"


# 反向信号：机构真实看好的特征
genuine_bullish_signals:
  - 主动偏股型基金净增持（不是ETF）
  - 外资（QFII/北向）增持
  - 融券余额下降（做空者撤退）
  - 调研热度高 且 融券不增（调研-做空方向一致）
  - 主力资金净流入 且 北向资金同向

  case_genuine: "300750 宁德时代：融券-4.1%（做空撤退），其余概念股全部相反"
